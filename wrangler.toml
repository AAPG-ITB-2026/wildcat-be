name = "wildcat-be"
main = "src/index.ts"
compatibility_date = "2024-02-21"
compatibility_flags = [ "nodejs_compat" ]

[[routes]]
pattern = "api.wildcat2026.com"
custom_domain = true

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "9037a7b995d2405e888770a264c2d2f5"

